# dsh-feishu-bridge 的 --patch 挂载示例（语义同 profile 的 cordis.patch.yml）
#
# 用法：dsh --profile <name> --patch /path/to/dsh-feishu-bridge/feishu.patch.yml
# 前提：插件已安装进对应 profile（dsh plugin --profile <name> add <path>）
- insert:
    - id: feishu-bridge
      name: dsh-feishu-bridge
      # 工作区配置示例（V3-only，使用宿主 workspaceRegistry，请按本机路径填写）：
      # config:
      #   defaultWorkspace: Workspace
      #   workspaceAdminOpenIds: [ou_xxx]
      #   workspaceRoots:
      #     - /home/zxsctxx

# 可选：agent-presets 服务行，提供 /preset 命令的预设列表与切换能力。
# 不插也能跑，但 /preset 会提示「宿主未组合 agentPresets」。
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: minimal