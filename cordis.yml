# dsh-feishu-bridge 组合配置示例（完整条目列表，仅供参考）
#
# 注意：dsh 的 --patch 只接受 patch 列表（顶层条目为 insert 或 id 定向覆盖），
# 不能直接传本文件。实际使用推荐装进 DSH profile（见 README「安装」方式一），
# 或使用仓库根目录的 feishu.patch.yml 在已有 profile 上叠加。
#
# 环境变量:
#   FEISHU_APP_ID       - 飞书 App ID
#   FEISHU_APP_SECRET   - 飞书 App Secret
#   FEISHU_DOMAIN       - feishu（国内）或 lark（海外）
#   DEEPSEEK_API_KEY    - LLM API Key（示例用 DeepSeek）
#   DSH_CWD             - Agent 工作目录（可选）

# ── 核心 spine ──
- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# ── LLM 适配器 ──
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKey: ${DEEPSEEK_API_KEY}

# ── 执行能力（按需启用） ──
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# ── 上下文管理 ──
- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# ── 持久化 ──
- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.dsh-sessions

# ── 飞书 IM 驱动 ──
- id: feishu-bridge
  name: 'dsh-feishu-bridge'
  config:
    appId: ${FEISHU_APP_ID}
    appSecret: ${FEISHU_APP_SECRET}
    domain: ${FEISHU_DOMAIN:-feishu}
    provider: deepseek
    model: deepseek-chat
    # 默认工作区：宿主工作区标题或 UUID；未设置时回退到第一个可用宿主工作区。
    # defaultWorkspace: Workspace
    # workspaceAdminOpenIds: [ou_xxx]
    # 运行时注册工作区允许的根目录（为空时禁止 /workspace add）
    # workspaceRoots:
    #   - /home/zxsctxx
    accessPolicy: allowlist
    allowedOpenIds: []
    allowedChatIds: []
    requireMentionInGroup: true
    showThinking: false
    debug: false